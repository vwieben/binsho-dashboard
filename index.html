<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noai, noimageai">
<title>Binsho Dashboard</title>
<meta name="description" content="Public performance dashboard for Binsho, a rule-based portfolio strategy. Relative figures only.">
<style>
  .viz-root {
    --fs: 1;
    color-scheme: light;
    --surface-0: #f4f3ef; --surface-1: #fcfcfb;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #706e69;
    --grid: #e1e0d9; --border: #e1e0d9;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #05a070;
    --good: #006300; --bad: #b3261e;
    --kpi-pos: #2e7d4f; --kpi-neg: #b23b32; --kpi-neutral: #33322f;
  }
  .viz-root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --border: #2c2c2a;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --good: #0ca30c; --bad: #e66767;
    --kpi-pos: #6cbf8a; --kpi-neg: #e5776c; --kpi-neutral: #dcdbd5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh;
    font: calc(15px * var(--fs))/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
  header .intro { flex: 1 1 420px; }
  .a11y { display: flex; gap: 8px; flex-wrap: wrap; }
  .a11y .grp { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .a11y button { font: inherit; font-size: calc(13px * var(--fs)); color: var(--text-primary); background: transparent; border: 0;
    min-width: 36px; min-height: 34px; padding: 4px 10px; cursor: pointer; }
  .a11y .grp button + button { border-left: 1px solid var(--border); }
  .a11y button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  .a11y button:disabled { color: var(--text-muted); cursor: default; }
  .a11y button:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
  header h1 { font-size: calc(26px * var(--fs)); margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--text-secondary); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; color: var(--text-secondary); font-size: calc(13px * var(--fs)); }
  .meta:empty::before { content: "\00a0"; }  /* keep one line reserved until the data arrives */
  /* KPI tiles: equal columns (6, 3, 2 or 1, set by fitTiles()), three fixed rows per tile */
  .tiles { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); gap: 12px; margin: 24px 0; }
  .tile { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; text-align: left;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile > div { width: fit-content; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .label { font-size: calc(0.8rem * var(--fs)); line-height: 1.3; height: 1.3em; color: var(--text-secondary); }
  .tile .value { font-size: calc(1.8rem * var(--fs)); line-height: 1.2; height: 1.2em; margin-top: 6px; font-weight: 600;
    font-variant-numeric: proportional-nums; color: var(--kpi-neutral); }  /* large standalone figures: proportional digits */
  .tile .ctx { font-size: calc(0.75rem * var(--fs)); line-height: 1.3; height: 1.3em; margin-top: 6px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
  .tile .value.up { color: var(--kpi-pos); }
  .tile .value.down { color: var(--kpi-neg); }
  .tile .value.none { color: var(--text-muted); font-weight: 400; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 8px; margin-bottom: 16px; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .pair .card { margin-bottom: 0; display: flex; flex-direction: column; min-width: 0; }
  .pair .legend { margin-top: auto; }
  @media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } }
  /* side by side: the cards share row heights (subgrid: title, description, legend, chart), so legend
     and chart start at the same height even when one description wraps to more lines than the other */
  @media (min-width: 761px) { @supports (grid-template-rows: subgrid) {
    .pair { row-gap: 0; }
    .pair .card { display: grid; grid-row: span 4; grid-template-rows: subgrid; grid-template-columns: minmax(0, 1fr); row-gap: 0; }
    .pair .legend { margin-top: 0; align-self: end; }
  } }
  .stale { color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .card h2 { font-size: calc(15px * var(--fs)); margin: 0 0 2px; }
  .card .desc { font-size: calc(12px * var(--fs)); color: var(--text-secondary); margin: 0 0 1.5em; }  /* one line of air before the legend */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: calc(12px * var(--fs)); color: var(--text-secondary); margin-bottom: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--c); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-muted); font-size: calc(11px * var(--fs)); font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: calc(12px * var(--fs)); box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; display: none; }
  .tip b { display: block; margin-bottom: 2px; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: calc(13px * var(--fs)); font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  td:not(:first-child) { white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .note { font-size: calc(12px * var(--fs)); color: var(--text-muted); margin: 8px 0 8px; }
  @media (max-width: 480px) {
    table { font-size: calc(12px * var(--fs)); }
    th, td { padding: 6px 3px; }
    .card.cmp { padding-left: 10px; padding-right: 10px; }
  }
  .method { padding-bottom: 4px; }
  .method p { font-size: calc(13px * var(--fs)); color: var(--text-secondary); margin: 6px 0 12px; }
  .method p.glossary, .disclaimer { font-size: calc(12px * var(--fs)); color: var(--text-secondary); }
  .method p.glossary { margin: 12px 0 8px; }
  .disclaimer { margin: 8px 0 0; }
  footer { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: calc(12px * var(--fs)); color: var(--text-muted); }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { text-decoration: none; }
  footer a:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .pos { color: var(--kpi-pos); } .neg { color: var(--kpi-neg); }
  .err { padding: 16px; border: 1px solid var(--bad); border-radius: 10px; color: var(--bad); }
</style>
</head>
<body>
<div class="viz-root" id="root">
<main>
  <header>
    <div class="intro">
      <h1>Binsho Dashboard</h1>
      <p data-i18n="lead"></p>
      <div class="meta" id="meta"></div>
    </div>
    <div class="a11y" role="toolbar" id="a11y">
      <div class="grp">
        <button type="button" id="lang-de" lang="de">DE</button>
        <button type="button" id="lang-en" lang="en">EN</button>
      </div>
      <div class="grp">
        <button type="button" id="fs-dn">A−</button>
        <button type="button" id="fs-up">A+</button>
      </div>
      <div class="grp">
        <button type="button" id="theme"></button>
      </div>
    </div>
  </header>

  <noscript><p class="err">Bitte JavaScript aktivieren. · Please enable JavaScript.</p></noscript>
  <section class="tiles" id="tiles" aria-busy="true"></section>

  <div class="pair">
  <section class="card">
    <h2 data-i18n="growth"></h2>
    <p class="desc" data-i18n="growthDesc"></p>
    <div class="legend" id="legend-idx"></div>
    <div class="chart" id="chart-idx"></div>
  </section>

  <section class="card">
    <h2 data-i18n="drawdown"></h2>
    <p class="desc" data-i18n="drawdownDesc"></p>
    <div class="legend" id="legend-dd"></div>
    <div class="chart" id="chart-dd"></div>
  </section>
  </div>

  <section class="card cmp">
    <h2 data-i18n="comparison"></h2>
    <div class="table-wrap"><table id="cmp"></table></div>
    <p class="note" id="cmp-note"></p>
  </section>

  <section class="card method">
    <h2 data-i18n="method"></h2>
    <p data-i18n="mTwr"></p>
    <p data-i18n="mDd"></p>
    <p data-i18n="mRatio"></p>
    <p data-i18n="mCalmar"></p>
    <p id="m-oos"></p>
    <p class="glossary" data-i18n="glossary"></p>
  </section>

  <p class="disclaimer" data-i18n="disclaimer"></p>

  <footer>
    <a href="impressum.html" data-i18n="legal"></a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/vwieben/binsho-dashboard">GitHub</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.linkedin.com/in/volkerwieben/">LinkedIn</a>
  </footer>
</main>
</div>

<script>
const T = {
  en: {
    lead: "Strategic core portfolio with a rule-based Bitcoin satellite, developed in Python with AI assistance following the principle “verification before implementation”. Performance compared with buy-and-hold benchmarks, shown in relative figures only.",
    growth: "Return",
    growthDesc: "Time-weighted, after trading commissions, before taxes, deposits removed.",
    drawdown: "Drawdown",
    drawdownDesc: "Decline from the previous high.",
    comparison: "Comparison",
    method: "Method",
    mTwr: "<b>Return</b> is time-weighted (TWR), after trading commissions and before taxes: deposits and withdrawals are removed, so the figure reflects the strategy, not the timing of capital.",
    mDd: "<b>Drawdown</b> is measured on that return index.",
    mRatio: "<b>Drawdown ratio</b> = Binsho's maximum drawdown divided by the benchmark's over the same period; below 1 means shallower losses. It is shown once the benchmark has fallen at least 1 %.",
    mCalmar: "<b>CAGR</b> (compound annual growth rate) and <b>Calmar ratio</b> (CAGR ÷ max drawdown) are shown in the Calmar ratio tile after 12 months.",
    mOos: d => `<b>Out-of-sample</b><br>All figures shown come from operation since ${d}, after the strategy had been fully developed and fixed. Backtest data is neither shown nor mixed in. Benchmarks are held fully invested from the same day (buy-and-hold).`,
    disclaimer: "Legal notice: Not investment advice or a recommendation, not an offer. Past performance is not a reliable indicator of future results. Short observation period, limited significance.",
    glossary: "<b>TWR</b> (time-weighted return): performance with the effect of deposits and withdrawals removed.<br><b>Max drawdown</b>: the largest decline from a previous peak to a later low.<br><b>Calmar ratio</b>: annual return (CAGR) divided by the size of the maximum drawdown.",
    stale: "Data delayed",
    legal: "Legal notice &amp; Privacy",
    keyFigures: "Key figures",
    paper: "Unattended live simulation on a paper account",
    since: (d, n) => `Since ${d} · ${n} days`, asOf: d => `Data as of ${d}`,
    twr: "Return (TWR)", sinceStart: "since start", vs: n => `vs ${n}`, excess: "Relative return",
    maxDd: "Max drawdown", curDd: "Current drawdown", fromHigh: "from peak",
    calmar: "Calmar ratio", after12: "with CAGR",
    thReturn: "Return", thMaxDd: "Max drawdown", thExcess: "Binsho relative return", thRatio: "Drawdown ratio",
    chartGrowth: "Growth: Binsho vs benchmarks", chartDd: "Drawdown: Binsho vs benchmarks",
    noData: "No data published yet.",
    toolbar: "Display settings", langDe: "Deutsch", langEn: "English",
    smaller: "Smaller text", larger: "Larger text", toDark: "Switch to dark mode", toLight: "Switch to light mode",
  },
  de: {
    lead: "Strategisches Kernportfolio mit regelbasiert gesteuertem Bitcoin-Satelliten, KI-gestützt in Python entwickelt nach dem Prinzip „Verifikation vor Implementierung“. Wertentwicklung im Vergleich zu Buy-and-Hold-Benchmarks, dargestellt ausschließlich in relativen Kennzahlen.",
    growth: "Rendite",
    growthDesc: "Zeitgewichtet, nach Handelsgebühren, vor Steuern, bereinigt um Einzahlungen.",
    drawdown: "Drawdown",
    drawdownDesc: "Rückgang vom vorherigen Hoch.",
    comparison: "Vergleich",
    method: "Methode",
    mTwr: "<b>Rendite</b> ist zeitgewichtet (TWR), nach Handelsgebühren und vor Steuern: Ein- und Auszahlungen sind herausgerechnet, die Kennzahl zeigt also die Strategie, nicht den Zeitpunkt des Kapitals.",
    mDd: "<b>Drawdown</b> wird auf diesem Renditeindex gemessen.",
    mRatio: "<b>Drawdown-Verhältnis</b> = maximaler Drawdown von Binsho geteilt durch den der Benchmark im selben Zeitraum; ein Wert unter 1 bedeutet flachere Verluste. Es wird angezeigt, sobald die Benchmark mindestens 1 % gefallen ist.",
    mCalmar: "<b>CAGR</b> (durchschnittliche jährliche Rendite) und <b>Calmar-Ratio</b> (CAGR ÷ max. Drawdown) werden nach 12 Monaten in der Kachel Calmar-Ratio angezeigt.",
    mOos: d => `<b>Out-of-Sample</b><br>Alle dargestellten Werte stammen aus dem Betrieb seit dem ${d}, nach abgeschlossener Entwicklung und Festlegung der Strategie. Backtest-Daten werden weder gezeigt noch eingemischt. Die Vergleichsindizes werden ab demselben Tag voll investiert gehalten (Buy-and-hold).`,
    disclaimer: "Rechtlicher Hinweis: Keine Anlageberatung oder -empfehlung, kein Angebot. Vergangene Wertentwicklung ist kein verlässlicher Indikator für künftige Ergebnisse. Kurzer Beobachtungszeitraum, eingeschränkte Aussagekraft.",
    glossary: "<b>TWR</b> (zeitgewichtete Rendite): Wertentwicklung ohne den Einfluss von Ein- und Auszahlungen.<br><b>Max. Drawdown</b>: größter Rückgang von einem bisherigen Höchststand bis zu einem späteren Tiefpunkt.<br><b>Calmar-Ratio</b>: jährliche Rendite (CAGR) geteilt durch den Betrag des maximalen Drawdowns.",
    stale: "Datenstand verzögert",
    legal: "Impressum &amp; Datenschutz",
    keyFigures: "Kennzahlen",
    paper: "Unbeaufsichtigte Live-Simulation mit Papierdepot",
    since: (d, n) => `Seit ${d} · ${n} Tage`, asOf: d => `Datenstand ${d}`,
    twr: "Rendite (TWR)", sinceStart: "seit Start", vs: n => `ggü. ${n}`, excess: "Relative Rendite",
    maxDd: "Max. Drawdown", curDd: "Akt. Drawdown", fromHigh: "vom Höchststand",
    calmar: "Calmar-Ratio", after12: "mit CAGR",
    thReturn: "Rendite", thMaxDd: "Max. Drawdown", thExcess: "Relative Rendite Binsho", thRatio: "Drawdown-Verhältnis",
    chartGrowth: "Wachstum: Binsho im Vergleich zu Benchmarks", chartDd: "Drawdown: Binsho im Vergleich zu Benchmarks",
    noData: "Noch keine Daten veröffentlicht.",
    toolbar: "Darstellung", langDe: "Deutsch", langEn: "English",
    smaller: "Schrift kleiner", larger: "Schrift größer", toDark: "Zum dunklen Modus wechseln", toLight: "Zum hellen Modus wechseln",
  },
};

// ---- settings (remembered per visitor where the browser allows it) ----
const store = {
  get(k) { try { return localStorage.getItem("binsho." + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("binsho." + k, v); } catch (e) {} },
};
const FS = [0.9, 1, 1.15, 1.3];
const sysDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
let lang = store.get("lang") || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");
if (!T[lang]) lang = "en";
let fsIdx = Math.max(0, Math.min(FS.length - 1, parseInt(store.get("fs") ?? "1", 10) || 0));
let theme = store.get("theme") || (sysDark && sysDark.matches ? "dark" : "light");
let data = null;
const t = () => T[lang];

const S = [
  { key: "idx",        name: "Binsho",     c: "var(--series-1)", w: 2.5 },
  { key: "msci_world", name: "MSCI World", c: "var(--series-2)", w: 2 },
  { key: "sp500",      name: "S&P 500",    c: "var(--series-3)", w: 2 },
];
const shortName = key => S.find(s => s.key === key).name;
const noteMark = key => ({ msci_world: "1", sp500: "2" })[key];
// footnote text is the same in German and English (fund names are proper names)
const FUND_NOTE = {
  msci_world: "ISIN IE00B4L5Y983 · iShares Core MSCI World UCITS ETF, Acc, EUR",
  sp500:      "ISIN IE00B5BMR087 · iShares Core S&amp;P 500 UCITS ETF, Acc, EUR",
};
// Xetra calendar as in yoshi/portfolio/takt.py: weekdays except New Year, Good Friday, Easter Monday,
// 1 May, 24-26 Dec and 31 Dec. Dates are handled as UTC midnight.
function easterUTC(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const n = h + l - 7 * m + 114;
  return Date.UTC(y, Math.floor(n / 31) - 1, n % 31 + 1);
}
function isXetraDay(ms) {
  const dt = new Date(ms), wd = dt.getUTCDay(), md = (dt.getUTCMonth() + 1) * 100 + dt.getUTCDate();
  if (wd === 0 || wd === 6 || [101, 501, 1224, 1225, 1226, 1231].includes(md)) return false;
  const e = easterUTC(dt.getUTCFullYear());
  return ms !== e - 2 * 864e5 && ms !== e + 864e5;
}
// Delayed when more than 2 Xetra trading days lie after as_of, up to and including today.
function isStale(asOf) {
  const now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  let n = 0;
  for (let ms = Date.parse(asOf + "T00:00:00Z") + 864e5; ms <= today; ms += 864e5) if (isXetraDay(ms)) n++;
  return n > 2;
}

const dec = s => lang === "de" ? s.replace(".", ",") : s;
// Percentages everywhere: real minus (U+2212), "+" for positive (if sign), narrow no-break space (U+202F) before "%".
// Rounds half away from zero first, so -0.04 % shows as "0,0 %" (no sign, neutral colour).
function pct(x, d = 1, sign = true) {
  if (x == null) return "–";
  const f = Math.pow(10, d), r = Math.sign(x) * Math.round(Math.abs(x) * 100 * f) / f;
  const s = r < 0 ? "−" : r > 0 && sign ? "+" : "";
  return s + dec(Math.abs(r).toFixed(d)) + " %";
}
const num = (x, d = 2) => x == null ? "–" : dec(x.toFixed(d)).replace("-", "−");
const kpiPct = (x, signed = true) => x == null ? null : pct(x, 1, signed);
const kpiTone = s => s.startsWith("+") ? "up" : s.startsWith("−") ? "down" : "";
// table colour follows the displayed (rounded) value, like the tiles
const cls = x => x == null ? "" : ({ up: "pos", down: "neg" })[kpiTone(pct(x))] || "";
// Equal columns: 6 in a row, else 3, else 2, else 1 — never 4 or 5, so rows stay full.
// Width needed per tile is measured from its widest single-line text, so language and text size are covered.
function fitTiles() {
  const host = el("tiles"); if (!host || !host.children.length) return;
  const gap = 12, W = host.clientWidth;
  let need = 0;
  for (const tile of host.children) {
    const cs = getComputedStyle(tile);
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
    for (const line of tile.children) need = Math.max(need, Math.ceil(line.scrollWidth) + pad);
  }
  const cols = [6, 3, 2].find(n => n * need + (n - 1) * gap <= W) || 1;
  host.style.setProperty("--cols", cols);
}
if (window.ResizeObserver) new ResizeObserver(() => fitTiles()).observe(document.getElementById("tiles"));
else window.addEventListener("resize", fitTiles);
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "short", year: "numeric" });
const el = (id) => document.getElementById(id);
// Out-of-sample start: from metrics.json (start), until it arrives the known first day of operation
const OOS_START = "2026-10-12";
function renderOos() {
  const s = new Date((data ? data.start : OOS_START) + "T00:00:00");
  const d = lang === "de" ? s.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })
    : s.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  el("m-oos").innerHTML = t().mOos(d);
}

function legend(id, series) {
  el(id).innerHTML = series.map(s => `<span style="--c:${s.c}">${s.name}</span>`).join("");
}

// Charts are drawn at the container's real pixel width (no viewBox scaling), so axis text keeps its
// CSS px size on every screen. Same width -> same height and same left margin, so the two charts
// side by side line up. Redrawn when the width or the text size changes.
const charts = {};  // id -> [rows, series, opts]
function lineChart(id, rows, series, opts) {
  charts[id] = [rows, series, opts];
  const host = el(id), W = Math.floor(host.clientWidth); if (!W) return;
  const fpx = 11 * FS[fsIdx];                                   // axis text size, as in .chart text
  const H = Math.round(Math.max(200, Math.min(300, W * 0.62)));
  const m = { t: 10, r: 12, b: Math.ceil(fpx + 15), l: Math.ceil(fpx * 4.4) + 8 };
  host.dataset.w = W;
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length;
  let lo = Infinity, hi = -Infinity;
  rows.forEach(r => series.forEach(s => { const v = r[s.key]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (opts.zeroTop) hi = 0;
  // headroom below only: the top edge of the plot is the highest value, in both charts the same rule,
  // so the 0 % lines line up as long as the return has not risen above 0 %
  const pad = (hi - lo) * 0.08 || 1; lo -= pad;
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + (hi - v) / (hi - lo) * ih;
  // ticks
  const step = niceStep((hi - lo) / 5), ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(v);
  const xt = [0, Math.round((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">`;
  ticks.forEach(v => svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${opts.tick(v, step)}</text>`);
  xt.forEach(i => svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${fmtDate(rows[i].d)}</text>`);
  if (opts.base != null) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(opts.base)}" y2="${y(opts.base)}" stroke="var(--text-muted)" stroke-width="1"/>`;
  [...series].reverse().forEach(s => {
    const d = rows.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`).join("");
    svg += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  svg += `<line id="${id}-x" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>`;
  series.forEach((s, k) => svg += `<circle id="${id}-p${k}" r="4" fill="${s.c}" stroke="var(--surface-1)" stroke-width="2" visibility="hidden"/>`);
  svg += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  host.innerHTML = svg;

  const svgEl = host.querySelector("svg"), tip = host.querySelector(".tip"), xl = el(id + "-x");
  function show(evt) {
    const b = svgEl.getBoundingClientRect(), sx = (evt.clientX - b.left) * W / b.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((sx - m.l) / iw * (n - 1))));
    xl.setAttribute("x1", x(i)); xl.setAttribute("x2", x(i)); xl.setAttribute("visibility", "visible");
    series.forEach((s, k) => { const p = el(`${id}-p${k}`); p.setAttribute("cx", x(i)); p.setAttribute("cy", y(rows[i][s.key])); p.setAttribute("visibility", "visible"); });
    tip.innerHTML = `<b>${fmtDate(rows[i].d)}</b>` + series.map(s => `<div><i style="--c:${s.c}"></i>${s.name}: ${opts.tip(rows[i][s.key])}</div>`).join("");
    tip.style.display = "block";
    // horizontal: right of the crosshair, else left of it, else centred on it (narrow screens)
    const k = b.width / W, px = x(i) * k, tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = px + 14 + tw <= b.width ? px + 14 : px - 14 - tw >= 0 ? px - 14 - tw : Math.max(0, Math.min(b.width - tw, px - tw / 2));
    // vertical: top of the plot, unless that hides one of the markers -> bottom of the plot
    const ys = series.map(s => y(rows[i][s.key]) * k);
    const hides = top => left < px + 6 && left + tw > px - 6 && ys.some(v => v >= top - 6 && v <= top + th + 6);
    let top = 8;
    if (hides(top)) { const bottom = (m.t + ih) * k - th - 4; if (!hides(bottom)) top = bottom; }
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hide() { xl.setAttribute("visibility", "hidden"); tip.style.display = "none";
    series.forEach((s, k) => el(`${id}-p${k}`).setAttribute("visibility", "hidden")); }
  svgEl.addEventListener("pointermove", show); svgEl.addEventListener("pointerleave", hide);
}

function redrawCharts() { Object.keys(charts).forEach(id => lineChart(id, ...charts[id])); }
if (window.ResizeObserver) {
  let raf = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      // only when a chart's width really changed (avoids redraw loops)
      if (Object.keys(charts).some(id => +el(id).dataset.w !== Math.floor(el(id).clientWidth))) redrawCharts();
    });
  }).observe(document.querySelector(".pair"));
} else window.addEventListener("resize", redrawCharts);

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

function drawdownOf(rows, key) {
  let peak = -Infinity;
  return rows.map(r => { peak = Math.max(peak, r[key]); return r[key] / peak - 1; });
}

// Tiles. Without data (m == null) they render as placeholders: same labels and contexts, value "–",
// so height and column count are already final before metrics.json arrives (no layout jump).
function renderTiles(m) {
  const L = t(), host = el("tiles"); if (!host) return;
  const k = m ? m.kpi : {}, b = m ? m.benchmarks : { msci_world: {}, sp500: {} }, annual = k.cagr != null;
  // [label, value, tone, context]; tone "signed" colours by sign, "neutral" never does
  const tiles = [
    [L.twr, kpiPct(k.twr), "signed", L.sinceStart],
    [L.excess, kpiPct(b.msci_world.excess), "signed", L.vs("MSCI World")],
    [L.excess, kpiPct(b.sp500.excess), "signed", L.vs("S&P 500")],
    [L.maxDd, kpiPct(k.max_dd, false), "neutral", `MSCI World ${kpiPct(b.msci_world.max_dd, false) ?? "–"}`],
    [L.curDd, kpiPct(k.current_dd, false), "neutral", L.fromHigh],
    [L.calmar, annual && k.calmar != null ? num(k.calmar) : null, "neutral", annual ? `CAGR ${kpiPct(k.cagr) ?? "–"}` : L.after12],
  ];
  host.innerHTML = tiles.map(([l, v, tone, s]) => {
    const c = v == null ? "none" : tone === "signed" ? kpiTone(v) : "";
    return `<div class="tile"><div class="label">${l}</div><div class="value ${c}">${v ?? "–"}</div><div class="ctx">${s || "&nbsp;"}</div></div>`;
  }).join("");
  host.setAttribute("aria-busy", m ? "false" : "true");
  fitTiles();
}

function render(m) {
  const L = t();
  const stale = isStale(m.as_of) ? `<span class="stale">${L.stale}</span>` : "";
  el("meta").innerHTML = `<span>${L.paper}</span><span>${L.since(fmtDate(m.start), m.days)}</span><span>${L.asOf(fmtDate(m.as_of))}</span>${stale}`;
  const b = m.benchmarks, k = m.kpi;
  renderTiles(m);
  renderOos();

  const rows = m.series;
  // axis decimals follow the tick step, so a narrow range never repeats a label
  const tickDec = step => step >= 0.01 - 1e-9 ? 0 : 1;
  // growth shown as change since start (index 100 -> 0 %), same format as the tiles
  const chgRows = rows.map(r => { const o = { d: r.d }; S.forEach(s => o[s.key] = r[s.key] / 100 - 1); return o; });
  legend("legend-idx", S);
  lineChart("chart-idx", chgRows, S, { label: L.chartGrowth, base: 0, tick: (v, st) => pct(v, tickDec(st)), tip: v => pct(v, 1) });
  const ddRows = rows.map((r, i) => ({ d: r.d }));
  S.forEach(s => drawdownOf(rows, s.key).forEach((v, i) => ddRows[i][s.key] = v));
  legend("legend-dd", S);
  lineChart("chart-dd", ddRows, S, { label: L.chartDd, zeroTop: true, base: 0, tick: (v, st) => pct(v, tickDec(st), false), tip: v => pct(v, 1, false) });

  el("cmp").innerHTML = `<tr><th></th><th>${L.thReturn}</th><th>${L.thMaxDd}</th><th>${L.thExcess}</th><th>${L.thRatio}</th></tr>
    <tr><td>Binsho</td><td>${pct(k.twr)}</td><td>${pct(k.max_dd, 1, false)}</td><td>–</td><td>–</td></tr>` +
    ["msci_world", "sp500"].map(key => `<tr><td>${shortName(key)}<sup>${noteMark(key)}</sup></td><td>${pct(b[key].twr)}</td><td>${pct(b[key].max_dd, 1, false)}</td>
      <td class="${cls(b[key].excess)}">${pct(b[key].excess)}</td><td>${num(b[key].dd_ratio)}</td></tr>`).join("");
  // full fund names with ISIN as a footnote (fixed here, not from metrics.json), short names in the table
  el("cmp-note").innerHTML = ["msci_world", "sp500"].map(key => `<sup>${noteMark(key)}</sup> ${FUND_NOTE[key]}`).join("<br>");
}

// ---- apply settings ----
function applyText() {
  const L = t();
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(n => n.innerHTML = L[n.dataset.i18n]);
  renderOos();
  el("tiles") && el("tiles").setAttribute("aria-label", L.keyFigures);
  el("a11y").setAttribute("aria-label", L.toolbar);
  el("lang-de").setAttribute("aria-pressed", lang === "de"); el("lang-de").title = L.langDe;
  el("lang-en").setAttribute("aria-pressed", lang === "en"); el("lang-en").title = L.langEn;
  el("fs-dn").setAttribute("aria-label", L.smaller); el("fs-dn").title = L.smaller;
  el("fs-up").setAttribute("aria-label", L.larger); el("fs-up").title = L.larger;
  applyTheme();
  const err = document.querySelector(".err"); if (err) err.textContent = L.noData;
  if (data) render(data); else renderTiles(null);
}
function applyFs() {
  el("root").style.setProperty("--fs", FS[fsIdx]);
  el("fs-dn").disabled = fsIdx === 0;
  el("fs-up").disabled = fsIdx === FS.length - 1;
  fitTiles();
  redrawCharts();
}
function applyTheme() {
  el("root").dataset.theme = theme;
  const L = t(), label = theme === "dark" ? L.toLight : L.toDark;
  el("theme").textContent = theme === "dark" ? "☀" : "☾";
  el("theme").setAttribute("aria-label", label); el("theme").title = label;
}

el("lang-de").addEventListener("click", () => { lang = "de"; store.set("lang", lang); applyText(); });
el("lang-en").addEventListener("click", () => { lang = "en"; store.set("lang", lang); applyText(); });
el("fs-dn").addEventListener("click", () => { if (fsIdx > 0) { fsIdx--; store.set("fs", fsIdx); applyFs(); } });
el("fs-up").addEventListener("click", () => { if (fsIdx < FS.length - 1) { fsIdx++; store.set("fs", fsIdx); applyFs(); } });
el("theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(); });
if (sysDark && sysDark.addEventListener) sysDark.addEventListener("change", e => { if (!store.get("theme")) { theme = e.matches ? "dark" : "light"; applyTheme(); } });

applyFs();
applyText();

fetch("metrics.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(m => { data = m; render(m); })
  .catch(() => { el("tiles").outerHTML = `<p class="err">${t().noData}</p>`; });
</script>
<script data-goatcounter="https://binsho.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
